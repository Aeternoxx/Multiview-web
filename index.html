<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MultiView Web — WHEP / WebRTC</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#080d20" />
    <meta
      name="description"
      content="MultiView Web : regardez plusieurs flux OBS (WHEP / WebRTC via MediaMTX) côte à côte dans votre navigateur."
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self' http: https:; object-src 'none'; base-uri 'self'; frame-src 'none'"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>

  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <img class="brand-icon" src="/favicon.png" alt="" />
          <div>
            <h1>MultiView <span class="brand-web">Web</span></h1>
            <p data-i18n="app.tagline"></p>
          </div>
        </div>

        <div class="topbar-actions">
          <button id="add-stream" class="primary-button" type="button">
            +&nbsp;<span data-i18n="header.addStream"></span>
          </button>

          <button
            id="open-settings"
            class="icon-button topbar-settings"
            type="button"
            data-i18n-title="header.settings"
          >
            <svg
              class="icon"
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.7 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"
              />
            </svg>
          </button>
        </div>
      </header>

      <nav class="view-tabs" role="tablist">
        <button
          id="tab-library"
          class="view-tab active"
          type="button"
          role="tab"
          aria-selected="true"
          data-i18n="tabs.library"
        ></button>
        <button
          id="tab-live"
          class="view-tab"
          type="button"
          role="tab"
          aria-selected="false"
          data-i18n="tabs.live"
        ></button>
      </nav>

      <section id="library-view" class="workspace">
        <div class="section-heading">
          <div>
            <h2 data-i18n="library.title"></h2>
            <p id="library-count"></p>
          </div>

          <div id="library-actions" class="library-actions" hidden>
            <button id="library-select-all" class="secondary-button" type="button"></button>
            <button id="library-clear-selection" class="secondary-button" type="button"></button>
            <button id="library-refresh" class="secondary-button" type="button"></button>
          </div>
        </div>

        <!-- Barre de lancement : posée sous l'en-tête, son apparition ne
             décale jamais les boutons d'action de la bibliothèque. -->
        <div id="selection-bar" class="selection-bar" hidden>
          <span id="selection-count"></span>
          <button id="launch-selected" class="primary-button" type="button"></button>
        </div>

        <div id="empty-state" class="empty-state" hidden>
          <div class="empty-icon">
            <svg
              class="icon"
              viewBox="0 0 24 24"
              width="26"
              height="26"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <rect x="4" y="4" width="7" height="7" rx="1.4" />
              <rect x="13" y="4" width="7" height="7" rx="1.4" />
              <rect x="4" y="13" width="7" height="7" rx="1.4" />
              <rect x="13" y="13" width="7" height="7" rx="1.4" />
            </svg>
          </div>
          <h2 data-i18n="empty.title"></h2>
          <p data-i18n="empty.body"></p>
          <button id="empty-add" class="primary-button" type="button" data-i18n="empty.action"></button>
        </div>

        <div id="library-list" class="library-list" hidden></div>
      </section>

      <section id="live-view" class="workspace" hidden>
        <div class="section-heading">
          <div>
            <h2 data-i18n="live.title"></h2>
            <p id="live-count"></p>
          </div>

          <div class="live-toolbar">
            <button id="live-fit" class="secondary-button" type="button"></button>
            <button id="live-reset-layout" class="secondary-button" type="button" hidden></button>
            <button id="live-stop-all" class="secondary-button danger" type="button" hidden></button>
          </div>
        </div>

        <div id="live-empty" class="empty-state" hidden>
          <div class="empty-icon">
            <svg
              class="icon"
              viewBox="0 0 24 24"
              width="26"
              height="26"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M8 5.2 18.6 12 8 18.8Z" fill="currentColor" stroke="none" />
            </svg>
          </div>
          <h2 data-i18n="live.empty.title"></h2>
          <p data-i18n="live.empty.body"></p>
          <button id="live-open-library" class="primary-button" type="button" data-i18n="live.empty.action"></button>
        </div>

        <div id="stream-grid" class="stream-grid" hidden></div>
      </section>

      <footer class="footer">
        <div class="footer-left">
          <strong>MultiView</strong>
          <span class="version">Web</span>
          <span class="footer-tech">WHEP · WebRTC</span>
        </div>

        <div class="footer-right">
          <button id="lang-fr" type="button" title="Français">FR</button>
          <span aria-hidden="true">|</span>
          <button id="lang-en" type="button" title="English">EN</button>

          <a
            class="kofi-link"
            href="https://ko-fi.com/aeternoxx"
            target="_blank"
            rel="noreferrer"
          >
            <img src="/kofi.svg" alt="" />
            <span data-i18n="footer.support"></span>
          </a>
        </div>
      </footer>
    </main>

    <!-- Dialogue ajout / modification d'un flux -->
    <div id="form-backdrop" class="modal-backdrop" hidden>
      <div class="modal-panel modal-panel-narrow" role="dialog" aria-modal="true">
        <header class="modal-header">
          <h2 id="form-title"></h2>
          <button id="form-close" class="icon-button" type="button" data-i18n-title="form.cancel"></button>
        </header>

        <form id="stream-form">
          <section class="modal-section">
            <label class="modal-field">
              <span data-i18n="stream.name"></span>
              <input
                id="form-name"
                data-i18n-placeholder="form.namePlaceholder"
                maxlength="80"
                autocomplete="off"
              />
            </label>

            <label class="modal-field">
              <span data-i18n="stream.url"></span>
              <input
                id="form-url"
                inputmode="url"
                data-i18n-placeholder="form.urlPlaceholder"
                autocomplete="off"
              />
            </label>

            <p id="form-error" class="player-error form-error" hidden></p>
            <p id="form-hint" class="modal-hint" data-i18n="form.hint"></p>
          </section>

          <div class="modal-footer">
            <button id="form-cancel" class="secondary-button" type="button" data-i18n="form.cancel"></button>
            <button id="form-submit" class="primary-button" type="submit"></button>
          </div>
        </form>
      </div>
    </div>

    <!-- Dialogue paramètres -->
    <div id="settings-backdrop" class="modal-backdrop" hidden>
      <div class="modal-panel" role="dialog" aria-modal="true" data-i18n-title="settings.title">
        <header class="modal-header">
          <h2 data-i18n="settings.title"></h2>
          <button id="settings-close" class="icon-button" type="button" data-i18n-title="settings.close"></button>
        </header>

        <section class="modal-section">
          <h3 data-i18n="settings.network.title"></h3>

          <label class="modal-field">
            <span data-i18n="settings.network.stun"></span>
            <input id="ice-stun" placeholder="stun:stun.example.com:3478" autocomplete="off" />
          </label>

          <label class="modal-field">
            <span data-i18n="settings.network.turn"></span>
            <input id="ice-turn" placeholder="turn:turn.example.com:3478" autocomplete="off" />
          </label>

          <div class="modal-row">
            <label class="modal-field">
              <span data-i18n="settings.network.username"></span>
              <input id="ice-username" autocomplete="off" />
            </label>

            <label class="modal-field">
              <span data-i18n="settings.network.password"></span>
              <input id="ice-password" type="password" autocomplete="off" />
            </label>
          </div>

          <p class="modal-hint" data-i18n="settings.network.hint"></p>
        </section>

        <section class="modal-section">
          <h3 data-i18n="settings.data.title"></h3>
          <div class="modal-actions">
            <button id="data-export" class="secondary-button" type="button" data-i18n="settings.data.export"></button>
            <button id="data-import" class="secondary-button" type="button" data-i18n="settings.data.import"></button>
          </div>
          <p id="settings-notice" class="modal-notice" hidden></p>
        </section>
      </div>
    </div>

    <!-- Dialogue de confirmation de suppression -->
    <div id="confirm-backdrop" class="modal-backdrop" hidden>
      <div class="modal-panel modal-panel-narrow" role="dialog" aria-modal="true">
        <header class="modal-header">
          <h2 data-i18n="stream.delete.title"></h2>
        </header>

        <section class="modal-section">
          <p id="confirm-message" class="modal-message"></p>
        </section>

        <div class="modal-footer">
          <button id="confirm-cancel" class="secondary-button" type="button" data-i18n="form.cancel"></button>
          <button id="confirm-ok" class="secondary-button danger" type="button" data-i18n="stream.delete.confirm"></button>
        </div>
      </div>
    </div>

    <input id="import-file" type="file" accept="application/json,.json" hidden />
  </body>
</html>
